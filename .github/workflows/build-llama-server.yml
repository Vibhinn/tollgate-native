name: Build llama-server

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # needed to attach release assets

env:
  LLAMA_CPP_REF: 81bc6b83f827df746eb129235488d325c49cae52

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14           # Apple Silicon (arm64) hosted runner
            asset_name: llama-server-macos-arm64
            archive_ext: tar.gz
          - os: ubuntu-latest       # x86_64
            asset_name: llama-server-linux-x86_64
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm    # arm64 (e.g. Graviton-class) - verify this
                                    # runner label is still current when you run this
            asset_name: llama-server-linux-arm64
            archive_ext: tar.gz
          - os: windows-latest      # x86_64
            asset_name: llama-server-windows-x86_64
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout llama.cpp at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ggerganov/llama.cpp
          ref: ${{ env.LLAMA_CPP_REF }}
          path: llama.cpp

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libcurl4-openssl-dev libssl-dev

      - name: Configure (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: llama.cpp
        shell: bash
        run: |
          EXTRA_FLAGS=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA_FLAGS="-DGGML_METAL=ON"
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DLLAMA_CURL=OFF \
            $EXTRA_FLAGS

      - name: Build (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: llama.cpp
        run: cmake --build build --config Release --target llama-server -j2

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: llama.cpp
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DLLAMA_CURL=OFF

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: llama.cpp
        shell: pwsh
        run: cmake --build build --config Release --target llama-server -j2

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: llama.cpp
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/llama-server dist/
          find build -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.dylib' \) -exec cp {} dist/ \;
          chmod +x dist/llama-server
          tar -czf ${{ matrix.asset_name }}.tar.gz -C dist .

      - name: Smoke test binary (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: llama.cpp
        shell: bash
        run: ./dist/llama-server --help > /dev/null

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: llama.cpp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build\bin\Release\llama-server.exe dist\
          Get-ChildItem -Path build -Recurse -Filter *.dll | Copy-Item -Destination dist\ -Force
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        working-directory: llama.cpp
        shell: pwsh
        run: |
          & .\dist\llama-server.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "llama-server.exe --help failed with exit code $LASTEXITCODE" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: llama.cpp/${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          retention-days: 14

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: llama-server-v1
          target_commitish: ${{ github.sha }}
          files: llama.cpp/${{ matrix.asset_name }}.${{ matrix.archive_ext }}

  update-tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Move llama-server-v1 to this commit
        run: |
          git tag -f llama-server-v1 ${{ github.sha }}
          git push origin llama-server-v1 --force
